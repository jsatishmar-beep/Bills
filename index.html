<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bills</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1d5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1f2328;--mu:#6b7280;--bd:#e2e0d8;--ac:#1d5fa8;--ac2:#e8f0fa;--dg:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--sf:#222427;--tx:#ececec;--mu:#9aa0a6;--bd:#34373b;--ac:#6aa7ec;--ac2:#1f2d3f;--dg:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
h1{font-size:20px;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center}
button,select,input,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--sf)}
button{border:1px solid var(--bd);background:var(--sf);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--dg)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.tabs button{white-space:nowrap;border-radius:20px}.tabs button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0;display:flex;gap:10px;cursor:pointer}
.th{width:56px;height:56px;border-radius:8px;background:var(--ac2);flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.mu{color:var(--mu);font-size:13px}.t{font-weight:600}.bc{font-size:12px;color:var(--ac)}
.warn{background:var(--ac2);border:1px solid var(--ac);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:12px;z-index:5}
#md{background:var(--bg);border-radius:12px;padding:14px;width:100%;max-width:560px;margin:auto}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
.fl{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;margin:5px 0;background:var(--sf)}
.fl span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imgs img{max-width:100%;border-radius:8px;border:1px solid var(--bd);margin:6px 0;display:block}
a{color:var(--ac)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:8px 14px;border-radius:20px;display:none;z-index:9}
</style></head><body>
<h1><span>🗂️ Bills</span><span class="row" style="flex:none"><button id="st">⚙︎</button><button class="p" id="ad">+ Add</button></span></h1>
<input id="q" type="search" placeholder="Search title, type, notes, file name, date…">
<div class="tabs" id="tabs"></div>
<div id="nudge"></div>
<div class="row" id="flt"></div>
<div id="lst"><p class="mu">Loading…</p></div>
<div id="ov"><div id="md"></div></div><div id="toast"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="fil" accept="image/jpeg,image/png,application/pdf,.jpg,.jpeg,.png,.pdf" multiple hidden>
<input type="file" id="imp" accept=".zip,application/zip" hidden>
<script>
const TREE={
 Property:{item:true,groups:{"Initial construction":["Land sale deed","Approvals","Construction","Interiors","Tax bills"],"Refurbishing":["Plumbing","Civil","Mechanical","Electrical"],"Running cost":["Electricity bill","Sewage / water bill","Other"]}},
 Vehicle:{item:true,groups:{"":["Purchase bill","Service bills","Insurance","RC book","Pollution"]}},
 Shopping:{item:false,groups:{"Home":["Home appliances"],"Personal":["Clothes"],"Fitness":[],"Entertainment":[]}}};
const CATS=Object.keys(TREE);
const DEF={Property:["Property 1","Property 2","Property 3"],Vehicle:["Vehicle 1","Vehicle 2","Vehicle 3"]};
const S={tab:"All",item:"",group:"",q:"",recs:[],items:JSON.parse(JSON.stringify(DEF)),lastBackup:0};
let F=null,sel=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3000)};
const isImg=f=>(f.type||"").startsWith("image/");

/* ---------- storage (IndexedDB, on this device) ---------- */
const idb=new Promise((res,rej)=>{const r=indexedDB.open("bills-vault-db",1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("records",{keyPath:"id"});d.createObjectStore("files",{keyPath:"id"});d.createObjectStore("meta",{keyPath:"k"})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const rq=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});
const os=async(n,m="readonly")=>(await idb).transaction(n,m).objectStore(n);
const getAll=async n=>rq((await os(n)).getAll());
const put=async(n,v)=>rq((await os(n,"readwrite")).put(v));
const del=async(n,k)=>rq((await os(n,"readwrite")).delete(k));
const get=async(n,k)=>rq((await os(n)).get(k));
const urls={};
async function url(id){if(urls[id]===undefined){const f=await get("files",id);urls[id]=f?URL.createObjectURL(f.blob):""}return urls[id]}
function dropUrl(id){if(urls[id]){URL.revokeObjectURL(urls[id])}delete urls[id]}
async function hydrate(){
 for(const el of document.querySelectorAll("[data-fid]")){
  const u=await url(el.dataset.fid);if(!u)continue;
  if(el.tagName==="IMG")el.src=u;else el.href=u;
 }
}
async function load(){
 S.recs=await getAll("records");
 const m=await get("meta","items");if(m)S.items={Property:m.v.Property||DEF.Property,Vehicle:m.v.Vehicle||DEF.Vehicle};
 const b=await get("meta","lastBackup");S.lastBackup=b?b.v:0;
 render();
}

/* ---------- list ---------- */
function blob(r){return [r.title,r.cat,r.item,r.group,r.type,r.notes,r.date,r.amount,(r.files||[]).map(f=>f.name).join(" ")].join(" ").toLowerCase()}
function visible(){
 const toks=S.q.toLowerCase().split(/\s+/).filter(Boolean);
 return S.recs.filter(r=>(S.tab==="All"||r.cat===S.tab)&&(!S.item||r.item===S.item)&&(!S.group||r.group===S.group)&&toks.every(t=>blob(r).includes(t)))
  .sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.created||0)-(a.created||0));
}
function render(){
 $("#tabs").innerHTML=["All",...CATS].map(c=>`<button data-tab="${c}" class="${S.tab===c?"on":""}">${c} (${c==="All"?S.recs.length:S.recs.filter(r=>r.cat===c).length})</button>`).join("");
 const old=!S.lastBackup||Date.now()-S.lastBackup>30*864e5;
 $("#nudge").innerHTML=S.recs.length&&old?`<div class="warn">Your data lives only on this phone. Tap ⚙︎ → Export backup to keep a safe copy.</div>`:"";
 let h="";
 if(S.tab!=="All"){
  const T=TREE[S.tab];
  if(T.item)h+=`<select id="fi"><option value="">All ${S.tab.toLowerCase()} items</option>${S.items[S.tab].map(i=>`<option ${S.item===i?"selected":""}>${esc(i)}</option>`).join("")}</select>`;
  const gs=Object.keys(T.groups).filter(g=>g);
  if(gs.length)h+=`<select id="fg"><option value="">All groups</option>${gs.map(g=>`<option ${S.group===g?"selected":""}>${esc(g)}</option>`).join("")}</select>`;
 }
 $("#flt").innerHTML=h;
 const v=visible();
 $("#lst").innerHTML=v.length?v.map(r=>{
  const im=(r.files||[]).find(isImg);
  const path=[r.cat,r.item,r.group,r.type].filter(Boolean).join(" › ");
  return `<div class="card" data-id="${r.id}"><div class="th">${im?`<img alt="" data-fid="${im.id}">`:((r.files||[]).length?"📄":"📁")}</div><div style="min-width:0"><div class="t">${esc(r.title||r.type||"Untitled")}</div><div class="bc">${esc(path)}</div><div class="mu">${esc(r.date||"")}${r.amount?" · ₹"+esc(r.amount):""} · ${(r.files||[]).length} file(s)</div></div></div>`}).join(""):`<p class="mu">${S.recs.length?"Nothing matches.":"No records yet. Tap + Add to save your first bill or deed."}</p>`;
 hydrate();
}

/* ---------- modal ---------- */
function open(html){$("#md").innerHTML=html;$("#ov").style.display="flex";hydrate()}
function close(){$("#ov").style.display="none";F=null;sel=null}
function opts(a,v){return a.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}

function detail(id){
 const r=S.recs.find(x=>x.id===id);if(!r)return;sel=id;
 const fs=r.files||[];
 open(`<div class="t" style="font-size:17px">${esc(r.title||r.type||"Untitled")}</div>
 <div class="bc">${esc([r.cat,r.item,r.group,r.type].filter(Boolean).join(" › "))}</div>
 <p class="mu">${esc(r.date||"")}${r.amount?" · ₹"+esc(r.amount):""}</p>
 ${r.notes?`<p>${esc(r.notes).replace(/\n/g,"<br>")}</p>`:""}
 <div class="imgs">${fs.map(f=>isImg(f)?`<a data-fid="${f.id}" target="_blank" rel="noopener"><img alt="${esc(f.name)}" data-fid="${f.id}"></a>`:`<div class="fl"><span>📄 ${esc(f.name)}</span><a data-fid="${f.id}" target="_blank" rel="noopener">Open</a><a data-fid="${f.id}" download="${esc(f.name)}">Save</a></div>`).join("")}</div>
 <div class="row" style="margin-top:12px"><button data-a="edit">Edit</button><button class="d" data-a="del">Delete</button><button data-a="close">Close</button></div>`);
}
function form(r){
 r=r||{};
 F={id:r.id||null,existing:(r.files||[]).slice(),staged:[],removed:[],created:r.created};
 const cat=r.cat||(S.tab!=="All"?S.tab:"Property");
 open(`<div class="t" style="font-size:17px">${r.id?"Edit record":"Add record"}</div>
 <label>Folder</label><select id="f_cat">${opts(CATS,cat)}</select>
 <div id="f_dyn"></div>
 <label>Title / description</label><input id="f_title" value="${esc(r.title||"")}" placeholder="e.g. Sale deed, Registration no. …">
 <div class="row"><div><label>Date</label><input id="f_date" type="date" value="${esc(r.date||"")}"></div><div><label>Amount (₹)</label><input id="f_amt" inputmode="decimal" value="${esc(r.amount||"")}"></div></div>
 <label>Notes</label><textarea id="f_notes" rows="2">${esc(r.notes||"")}</textarea>
 <label>Files (JPG, PNG or PDF)</label><div id="f_files"></div>
 <div class="row" style="margin-top:6px"><button data-a="cam">📷 Camera</button><button data-a="fil">📎 Attach</button></div>
 <div class="row" style="margin-top:14px"><button class="p" data-a="save">Save</button><button data-a="close">Cancel</button></div>`);
 dyn(r);files();
}
function dyn(r){
 r=r||{};const cat=$("#f_cat").value,T=TREE[cat];
 const gs=Object.keys(T.groups).filter(g=>g);
 const g0=$("#f_grp")?$("#f_grp").value:(r.group||gs[0]||"");
 const grp=gs.includes(g0)?g0:(gs[0]||"");
 const types=(T.groups[grp]||T.groups[""]||[]);
 const old=r.type||($("#f_type")?$("#f_type").value:"");
 $("#f_dyn").innerHTML=(T.item?`<label>${cat} item</label><select id="f_item">${opts(S.items[cat],r.item||($("#f_item")?$("#f_item").value:""))}</select>`:"")+
  (gs.length?`<label>Group</label><select id="f_grp">${opts(gs,grp)}</select>`:"")+
  `<label>Type</label><input id="f_type" list="tl" value="${esc(old)}" placeholder="Pick or type your own"><datalist id="tl">${types.map(t=>`<option value="${esc(t)}">`).join("")}</datalist>`;
}
function files(){
 $("#f_files").innerHTML=[...F.existing.map((f,i)=>`<div class="fl"><span>${isImg(f)?"🖼️":"📄"} ${esc(f.name)}</span><button data-a="rx" data-i="${i}">✕</button></div>`),
  ...F.staged.map((f,i)=>`<div class="fl"><span>${f.type.startsWith("image/")?"🖼️":"📄"} ${esc(f.name)} <small class="mu">(new)</small></span><button data-a="rs" data-i="${i}">✕</button></div>`)].join("")||`<span class="mu">No files attached.</span>`;
}
function stage(list){
 for(const f of list){
  const ok=/^image\//.test(f.type)||f.type==="application/pdf"||/\.(jpe?g|png|pdf)$/i.test(f.name);
  if(!ok){toast("Only JPG, PNG or PDF files");continue}
  F.staged.push({blob:f,name:f.name||("Photo "+new Date().toLocaleString()+".jpg"),type:f.type||"application/pdf"});
 }
 files();
}
function prep(s){
 if(!s.type.startsWith("image/"))return Promise.resolve({b:s.blob,type:s.type});
 return new Promise(res=>{
  const u=URL.createObjectURL(s.blob),im=new Image();
  im.onload=()=>{const k=Math.min(1,2200/Math.max(im.width,im.height)),c=document.createElement("canvas");
   c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
   c.toBlob(b=>{URL.revokeObjectURL(u);res(b?{b,type:"image/jpeg"}:{b:s.blob,type:s.type})},"image/jpeg",.85)};
  im.onerror=()=>{URL.revokeObjectURL(u);res({b:s.blob,type:s.type})};
  im.src=u;
 });
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function save(){
 const btn=document.querySelector('[data-a="save"]');
 const rec={cat:$("#f_cat").value,item:$("#f_item")?$("#f_item").value:"",group:$("#f_grp")?$("#f_grp").value:"",type:$("#f_type").value.trim(),title:$("#f_title").value.trim(),date:$("#f_date").value,amount:$("#f_amt").value.trim(),notes:$("#f_notes").value.trim()};
 if(!rec.title&&!rec.type){toast("Add a title or type");return}
 btn.disabled=true;btn.textContent="Saving…";
 try{
  const fl=F.existing.slice();
  for(const s of F.staged){
   const p=await prep(s),id=uid();
   await put("files",{id,blob:p.b,name:s.name,type:p.type});
   fl.push({id,name:p.type==="image/jpeg"?s.name.replace(/\.\w+$/,"")+".jpg":s.name,type:p.type});
  }
  rec.files=fl;rec.created=F.created||Date.now();rec.id=F.id||uid();
  await put("records",rec);
  for(const f of F.removed){await del("files",f.id);dropUrl(f.id)}
  close();await load();toast("Saved");
 }catch(e){btn.disabled=false;btn.textContent="Save";toast("Could not save: "+((e&&e.message)||"error"))}
}
async function remove(){
 const b=document.querySelector('[data-a="del"]');
 if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Tap again to confirm";return}
 const r=S.recs.find(x=>x.id===sel);if(!r)return;
 for(const f of(r.files||[])){await del("files",f.id);dropUrl(f.id)}
 await del("records",r.id);close();await load();toast("Deleted");
}

/* ---------- settings, rename items, backup ---------- */
function settings(){
 open(`<div class="t" style="font-size:17px">Settings</div>
 <p class="mu">All records and files are stored on this phone only. Export a backup regularly – it is a ZIP you can save to Google Drive or email to yourself.</p>
 <p class="mu">Last backup: ${S.lastBackup?new Date(S.lastBackup).toLocaleString():"never"}</p>
 <div class="row" style="flex-wrap:wrap"><button data-a="exp">⬇︎ Export backup</button><button data-a="imp">⬆︎ Import backup</button><button data-a="mng">Rename items</button><button data-a="close">Close</button></div>
 <p class="mu" id="sinfo"></p>`);
 if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{$("#sinfo").textContent="Storage used: "+(e.usage/1048576).toFixed(1)+" MB"});
}
function manage(){
 open(`<div class="t" style="font-size:17px">Rename or add items</div><p class="mu">Give properties and vehicles real names, for example “KK Nagar house”. Records follow the rename.</p>
 ${["Property","Vehicle"].map(c=>`<label>${c}</label><div id="m_${c}">${S.items[c].map(i=>`<input data-old="${esc(i)}" value="${esc(i)}" style="margin:3px 0">`).join("")}</div><button data-a="madd" data-c="${c}" style="margin-top:4px">+ Add ${c.toLowerCase()}</button>`).join("")}
 <div class="row" style="margin-top:14px"><button class="p" data-a="msave">Save</button><button data-a="close">Cancel</button></div>`);
}
async function msave(){
 const items={},ren=[];
 for(const c of ["Property","Vehicle"]){
  items[c]=[];
  document.querySelectorAll("#m_"+c+" input").forEach(i=>{const v=i.value.trim();if(!v||items[c].includes(v))return;items[c].push(v);const o=i.dataset.old;if(o&&o!==v)ren.push({c,o,v})});
 }
 await put("meta",{k:"items",v:items});
 for(const x of ren)for(const r of S.recs.filter(r=>r.cat===x.c&&r.item===x.o))await put("records",Object.assign({},r,{item:x.v}));
 close();await load();toast("Saved");
}
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=-1;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
function makeZip(entries){
 const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 for(const e of entries){
  const nm=enc.encode(e.name),crc=crc32(e.data),sz=e.data.length;
  const h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
  h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);
  parts.push(h.buffer,nm,e.data);
  const c=new DataView(new ArrayBuffer(46));
  c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
  c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cen.push(c.buffer,nm);off+=30+nm.length+sz;
 }
 let cs=0;cen.forEach(x=>cs+=x.byteLength);
 const end=new DataView(new ArrayBuffer(22));
 end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
 return new Blob([...parts,...cen,end.buffer],{type:"application/zip"});
}
function readZip(buf){
 const v=new DataView(buf),u=new Uint8Array(buf),dec=new TextDecoder(),out={};
 let e=buf.byteLength-22;while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;
 if(e<0)throw new Error("Not a backup file");
 const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);
 for(let i=0;i<n;i++){
  if(v.getUint32(p,true)!==0x02014b50)throw new Error("Bad backup file");
  const method=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);
  if(method!==0)throw new Error("Use a backup exported by this app");
  const name=dec.decode(u.subarray(p+46,p+46+nl));
  const ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);
  out[name]=u.subarray(ds,ds+cs);p+=46+nl+el+cl;
 }
 return out;
}
async function exportBackup(){
 try{
  const recs=await getAll("records"),fl=await getAll("files"),m=await get("meta","items");
  const ents=[{name:"data.json",data:new TextEncoder().encode(JSON.stringify({app:"documents-vault",v:1,records:recs,items:m?m.v:null,files:fl.map(f=>({id:f.id,name:f.name,type:f.type}))}))}];
  for(const f of fl)ents.push({name:"files/"+f.id,data:new Uint8Array(await f.blob.arrayBuffer())});
  const z=makeZip(ents),d=new Date().toISOString().slice(0,10),name="vault-backup-"+d+".zip";
  const file=new File([z],name,{type:"application/zip"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name})}catch(e){if(e&&e.name==="AbortError")return}}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(z);a.download=name;document.body.appendChild(a);a.click();a.remove()}
  await put("meta",{k:"lastBackup",v:Date.now()});await load();toast("Backup exported");
 }catch(e){toast("Export failed: "+((e&&e.message)||"error"))}
}
async function importBackup(file){
 try{
  const z=readZip(await file.arrayBuffer()),dec=new TextDecoder();
  const d=JSON.parse(dec.decode(z["data.json"]));
  if(d.app!=="documents-vault")throw new Error("Not a Documents Vault backup");
  for(const f of d.files){const b=z["files/"+f.id];if(b)await put("files",{id:f.id,name:f.name,type:f.type,blob:new Blob([b],{type:f.type})});dropUrl(f.id)}
  for(const r of d.records)await put("records",r);
  if(d.items)await put("meta",{k:"items",v:d.items});
  close();await load();toast("Imported "+d.records.length+" records");
 }catch(e){toast("Import failed: "+((e&&e.message)||"error"))}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 if(e.target.id==="ov")return close();
 if(e.target.closest("#ad"))return form();
 if(e.target.closest("#st"))return settings();
 const t=e.target.closest("[data-tab],[data-id],[data-a]");if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;S.item="";S.group="";render()}
 else if(t.dataset.id&&!t.dataset.a)detail(t.dataset.id);
 else{const a=t.dataset.a;
  if(a==="close")close();
  else if(a==="edit")form(S.recs.find(x=>x.id===sel));
  else if(a==="del")remove();
  else if(a==="save")save();
  else if(a==="cam")$("#cam").click();
  else if(a==="fil")$("#fil").click();
  else if(a==="rx"){F.removed.push(F.existing.splice(+t.dataset.i,1)[0]);files()}
  else if(a==="rs"){F.staged.splice(+t.dataset.i,1);files()}
  else if(a==="mng")manage();
  else if(a==="exp")exportBackup();
  else if(a==="imp")$("#imp").click();
  else if(a==="madd"){const i=document.createElement("input");i.style.margin="3px 0";i.placeholder="New name";$("#m_"+t.dataset.c).appendChild(i);i.focus()}
  else if(a==="msave")msave();
 }
});
document.addEventListener("change",e=>{
 const id=e.target.id;
 if(id==="f_cat")dyn({});
 else if(id==="f_grp"){$("#f_type").value="";dyn({group:e.target.value})}
 else if(id==="fi"){S.item=e.target.value;render()}
 else if(id==="fg"){S.group=e.target.value;render()}
 else if(id==="cam"||id==="fil"){stage([...e.target.files]);e.target.value=""}
 else if(id==="imp"){if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=""}
});
$("#q").addEventListener("input",e=>{S.q=e.target.value;render()});

/* ---------- boot ---------- */
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
load().catch(()=>{$("#lst").innerHTML='<p class="mu">Could not open local storage. Private/incognito mode blocks it.</p>'});
</script></body></html>
